---
- name: Install etcd
  apt:
    name:
      - etcd-server
      - etcd-client
    state: present
    update_cache: true
  tags:
    - etcd_setup

- name: Deploy etcd config
  template:
    src: etcd.conf.j2
    dest: /etc/default/etcd
    owner: root
    group: root
    mode: "0644"
  notify: restart etcd
  tags:
    - etcd_setup

- name: Enable etcd
  systemd:
    name: etcd
    enabled: true
    state: started
  tags:
    - etcd_setup
